# solana-sdk repos
solana-sdk = "=2.2.2"
solana-logger = "2.3.1"
solana-derivation-path = "2.2.1"

anchor-lang = { version = "0.31.0", git = "https://github.com/step-finance/anchor", rev = "48ad313829ecc72438d80eb25070d2b6ba5dccab" }

indexer_rabbitmq = { package = "holaplex-indexer-rabbitmq", git = "https://github.com/step-finance/indexer-geyser-plugin", rev = "02ad5e3e705b806439b63d4a9d8451c116e159d5" }
