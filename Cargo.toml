[workspace]
members = [
  "./crates/*",
  "libs/step-common-rust/crates/ingestooor-sdk",
  "libs/step-common-rust/crates/ingestooor-derive",
  "libs/step-common-rust/crates/step-common-rust",
]
resolver = "2"

[workspace.lints]
clippy.unwrap_used = "deny"

[workspace.package]


# update this if there are Dooot changes!
version = "0.5.1"


authors = ["Dana", "Quellen"]
repository = "https://github.com/step-finance/step-ingestooor"
homepage = "https://step.finance/"
edition = "2021"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true

[workspace.dependencies]
proc-macro2 = "1"
quote = "1"
syn = "2.0.53"
clap = "3.2.23"
futures-util = "0.3.19"
futures = "0.3.30"
dotenv = "0.15.0"
lapin = "2.0.3"
log = "0.4.14"
tokio = "1.35.1"
tokio-executor-trait = "2.1.0"
tokio-reactor-trait = "1.1.0"
anyhow = "1.0.79"
env_logger = "0.10.1"
hostname = "^0.3"
serde_json = "1.0.135"
serde = "1.0.217"
concat-idents = "1.1.5"
enum_dispatch = "0.3.13"
bs58 = "0.5.0"
spl-token = "4.0.0"
bincode = "1.3.3"
regex = "1.10.2"
spl-token-2022 = "4.0.0"
zstd = "0.13.0"
base64 = "0.21.7"
thread_local = "1.1.7"
itertools = "0.12.1"
tokio-postgres = "0.7.10"
rust_decimal = { version = "1.34.3", features = ["db-tokio-postgres", "maths"] }
postgres-types = "0.2.6"
bytes = "1.5.0"
strum = "0.26.1"
strum_macros = "0.26.1"
chrono = "0.4.38"
deadpool-postgres = "0.12.1"
borsh = "=0.10.3"
async-trait = "0.1.77"
serde_with = "3.6.1"
slab_tree = "0.3.2"
metrics-exporter-prometheus = "0.17"
metrics = "0.24.2"
reqwest = "0.12.3"
mpl-token-metadata = "5.1.0"
rand = "0.8.5"
fixed = "1.12.0"
ts-rs = { version = "10.1.0", features = ["no-serde-warnings"] }
evalexpr = "11.3.0"
primitive-types = "0.12.2"
num_enum = "0.7.2"
tokio-stream = "0.1.15"
async-stream = "0.3.5"
bytemuck = { version = "1.16.1", features = ["derive", "min_const_generics"] }
rayon = "1.10.0"
crossbeam = "0.8.4"
parking_lot = "0.12.3"
serde_repr = "0.1.19"
uint = "0.10.0"
thiserror = "1.0.64"
num-traits = "0.2.19"
num-derive = "0.4.2"
arrayref = "0.3.9"
cid = "0.11.1"
clickhouse = { version = "0.13.1", features = ["inserter", "native-tls"] }
axum = "0.8.4"
rustls = { version = "0.23.26", features = ["ring"] }

# local path deps
step-ingestooor-sdk = { path = "./libs/step-common-rust/crates/ingestooor-sdk" }
step-common-rust = { path = "./libs/step-common-rust/crates/step-common-rust" }

### SOLANA DEPS. PLEASE KEEP THEM UNDER THIS COMMENT. WE USE THIS SECTION TO COPY-PASTE TO step-common-rust dir
# agave
solana-client = "=2.2.16"
